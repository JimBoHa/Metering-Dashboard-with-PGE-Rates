[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metering-dashboard"
version = "0.4.0"
description = "Private-network utility metering, TOU pricing and shared cost allocation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.128,<0.129", "uvicorn>=0.39,<0.40", "httpx>=0.28,<0.29", "openpyxl>=3.1.5,<3.2", "bacpypes3==0.0.110", "pymodbus==3.8.6", "python-tds==1.17.1", "pyOpenSSL>=26.4,<27", "cryptography>=50,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
metering-dashboard = "metering.__main__:main"

[tool.setuptools.package-data]
metering = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["metering*"]
